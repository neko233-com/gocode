name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  GOWORK: 'off'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows amd64 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GOARCH: amd64
      GOAMD64: v1
      GOEXPERIMENT: cgocheck2
      CC: gcc
      CXX: g++
      GOCODE_SCREENSHOT: .cache/workbench-windows.png
      GOCODE_LSP_SCREENSHOT: .cache/gopls-native-acceptance.png
      GOCODE_UPDATES_SCREENSHOT: .cache/updates-native-settings.png
      GOCODE_CLOSE_SCREENSHOTS: .cache/close-native
      GOCODE_FILEWATCH_SCREENSHOTS: .cache/filewatch-native-lsp
      GODESKTOP_READBACK: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate Windows amd64
        shell: powershell
        run: ./scripts/test-windows-amd64.ps1
      - name: Verify actual GiB text and native long-line browsing
        if: matrix.os == 'windows-2025'
        shell: powershell
        env:
          GOCODE_LARGEFILE_GIB: '1'
          GOCODE_LARGEFILE_SCREENSHOT: .cache/largefile-gib-native.png
        run: |
          go test -race -run '^TestGiBBrowsing$' -v -timeout 3m ./internal/largefile
          if ($LASTEXITCODE -ne 0) { throw 'GiB file acceptance failed.' }
          & ./bin/gocode.exe -largefile-smoke -largefile-smoke-mib 1024 -extensions-dir .cache/extensions
          if ($LASTEXITCODE -ne 0) { throw 'GiB native browsing failed.' }
      - name: Verify actual GiB single-line search and native result navigation
        if: matrix.os == 'windows-2025'
        shell: powershell
        env:
          GOCODE_SEARCH_GIB: '1'
          GOCODE_SEARCH_SCREENSHOTS: .cache/search-gib-native
        run: |
          go test -race -run '^TestStreamingLimitCancellationAndGiB$' -v -timeout 3m ./internal/search
          if ($LASTEXITCODE -ne 0) { throw 'Actual GiB search failed.' }
          & ./bin/gocode.exe -search-smoke -search-smoke-mib 1024
          if ($LASTEXITCODE -ne 0) { throw 'Native GiB search/navigation failed.' }
      - name: Verify actual GiB independent split pages and source hash
        if: matrix.os == 'windows-2025'
        shell: powershell
        env:
          GOCODE_GROUPS_SCREENSHOTS: .cache/editor-groups-gib
        run: |
          & ./bin/gocode.exe -groups-large-smoke -groups-large-mib 1024
          if ($LASTEXITCODE -ne 0) { throw 'Actual GiB split/index/lifetime/hash failed.' }
      - name: Install pinned official Copilot sidecars
        shell: powershell
        run: |
          & ./bin/gocode.exe -install-copilot
          if ($LASTEXITCODE -ne 0) { throw 'Managed Copilot installation failed.' }
      - name: Verify official Copilot protocol without paid requests
        shell: powershell
        run: |
          & ./bin/gocode.exe -workspace . -copilot-check | Tee-Object -FilePath .cache/copilot-health.json
          if ($LASTEXITCODE -ne 0) { throw 'Copilot runtime handshake failed.' }
      - name: Verify pinned official gopls in the native workbench
        shell: powershell
        run: |
          & ./bin/gocode.exe -install-gopls
          if ($LASTEXITCODE -ne 0) { throw 'Gopls installation failed.' }
          & ./bin/gocode.exe -lsp-smoke -extensions-dir .cache/extensions
          if ($LASTEXITCODE -ne 0) { throw 'Native LSP acceptance failed.' }
          & ./bin/gocode.exe -filewatch-smoke -extensions-dir .cache/extensions
          if ($LASTEXITCODE -ne 0) { throw 'Native external file watch/gopls/VSIX acceptance failed.' }
      - name: Verify free MSI install, upgrade, rollback and uninstall
        if: matrix.os == 'windows-2025'
        shell: powershell
        run: ./scripts/test-msi.ps1
      - name: Build versioned Windows installer and portable package
        if: matrix.os == 'windows-2025'
        shell: powershell
        run: ./scripts/build-windows-package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gocode-windows-amd64-${{ matrix.os }}
          path: |
            bin/*.exe
            coverage.out
            .cache/workbench-windows*.png
            .cache/largefile-native-acceptance.png
            .cache/largefile-gib-native.png
            .cache/gopls-native-acceptance.png
            .cache/updates-native-settings.png
            .cache/close-native/*.png
            .cache/terminal-native/*.png
            .cache/terminal-native/*.json
            .cache/terminal-vsix/*.png
            .cache/terminal-vsix/*.json
            .cache/filewatch-native/*.png
            .cache/filewatch-native-lsp/*.png
            .cache/open-native/*.png
            .cache/workbench-ui/*.png
            .cache/editor-tabs/*.png
            .cache/editor-tabs/*.json
            .cache/editor-groups/*.png
            .cache/editor-groups/*.json
            .cache/editor-groups-gib/*.png
            .cache/editor-groups-gib/*.json
            .cache/search-native/*.png
            .cache/search-native/*.json
            .cache/search-gib-native/*.png
            .cache/search-gib-native/*.json
            .cache/replace-native/*.png
            .cache/replace-native/*.json
            .cache/copilot-health.json
            dist/*.zip
            dist/*.msi
            .cache/msi-validation/**/*.log
          include-hidden-files: true
          if-no-files-found: warn
  macos:
    name: macOS / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GOEXPERIMENT: cgocheck2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: go test -race -shuffle=on -count=3 -coverprofile=coverage.out ./...
      - run: go vet ./...
      - name: Build and smoke native workbench
        env:
          GODESKTOP_READBACK: '1'
        run: |
          mkdir -p bin
          go build -trimpath -ldflags="-s -w" -o bin/gocode .
          ./bin/gocode -workspace . -extensions-dir .cache/extensions -smoke
          ./bin/gocode -ui-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_UI_SCREENSHOTS=.cache/workbench-ui-150 ./bin/gocode -ui-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_UI_SCREENSHOTS=.cache/workbench-ui-200 ./bin/gocode -ui-smoke
          ./bin/gocode -tabs-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_TABS_SCREENSHOTS=.cache/editor-tabs-150 ./bin/gocode -tabs-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_TABS_SCREENSHOTS=.cache/editor-tabs-200 ./bin/gocode -tabs-smoke
          ./bin/gocode -groups-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_GROUPS_SCREENSHOTS=.cache/editor-groups-150 ./bin/gocode -groups-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_GROUPS_SCREENSHOTS=.cache/editor-groups-200 ./bin/gocode -groups-smoke
          ./bin/gocode -groups-vsix-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_GROUPS_SCREENSHOTS=.cache/editor-groups-vsix-150 ./bin/gocode -groups-vsix-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_GROUPS_SCREENSHOTS=.cache/editor-groups-vsix-200 ./bin/gocode -groups-vsix-smoke
          ./bin/gocode -groups-large-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_GROUPS_SCREENSHOTS=.cache/editor-groups-large-150 ./bin/gocode -groups-large-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_GROUPS_SCREENSHOTS=.cache/editor-groups-large-200 ./bin/gocode -groups-large-smoke
          ./bin/gocode -search-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_SEARCH_SCREENSHOTS=.cache/search-native-150 ./bin/gocode -search-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_SEARCH_SCREENSHOTS=.cache/search-native-200 ./bin/gocode -search-smoke
          ./bin/gocode -replace-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_REPLACE_SCREENSHOTS=.cache/replace-native-150 ./bin/gocode -replace-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_REPLACE_SCREENSHOTS=.cache/replace-native-200 ./bin/gocode -replace-smoke
          ./bin/gocode -extensions-dir .cache/extensions -open-smoke
          ./bin/gocode -extensions-dir .cache/extensions -editor-smoke
          for mode in save discard cancel external; do
            ./bin/gocode -extensions-dir .cache/extensions -close-smoke "$mode"
          done
          ./bin/gocode -extensions-dir .cache/extensions -largefile-smoke
          GOCODE_TERMINAL_SCREENSHOTS=.cache/terminal-native ./bin/gocode -extensions-dir .cache/extensions -terminal-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_TERMINAL_SCREENSHOTS=.cache/terminal-native-150 ./bin/gocode -extensions-dir .cache/extensions -terminal-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_TERMINAL_SCREENSHOTS=.cache/terminal-native-200 ./bin/gocode -extensions-dir .cache/extensions -terminal-smoke
          ./bin/gocode -terminal-vsix-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=1.5 GOCODE_TERMINAL_VSIX_SCREENSHOTS=.cache/terminal-vsix-150 ./bin/gocode -terminal-vsix-smoke
          GODESKTOP_TEST_DRAWABLE_SCALE=2 GOCODE_TERMINAL_VSIX_SCREENSHOTS=.cache/terminal-vsix-200 ./bin/gocode -terminal-vsix-smoke
          ./bin/gocode -extensions-dir .cache/extensions -filewatch-smoke -lsp=false
      - name: Install pinned official Copilot sidecars
        run: ./bin/gocode -install-copilot
      - name: Verify official Copilot protocol without paid requests
        run: ./bin/gocode -workspace . -copilot-check > .cache/copilot-health.json
      - name: Verify pinned official gopls in the native workbench
        run: |
          ./bin/gocode -install-gopls
          ./bin/gocode -lsp-smoke -extensions-dir .cache/extensions
          ./bin/gocode -filewatch-smoke -extensions-dir .cache/extensions
      - name: Package and verify free macOS bundle and updater archive
        run: sh scripts/build-macos-package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gocode-${{ runner.os }}-${{ runner.arch }}
          path: |
            bin/gocode
            coverage.out
            .cache/copilot-health.json
            .cache/workbench-ui/*.png
            .cache/workbench-ui-150/*.png
            .cache/workbench-ui-200/*.png
            .cache/editor-tabs/*.png
            .cache/editor-tabs/*.json
            .cache/editor-tabs-150/*.png
            .cache/editor-tabs-150/*.json
            .cache/editor-tabs-200/*.png
            .cache/editor-tabs-200/*.json
            .cache/editor-groups/*.png
            .cache/editor-groups/*.json
            .cache/editor-groups-150/*.png
            .cache/editor-groups-150/*.json
            .cache/editor-groups-200/*.png
            .cache/editor-groups-200/*.json
            .cache/editor-groups-vsix-150/*.png
            .cache/editor-groups-vsix-150/*.json
            .cache/editor-groups-vsix-200/*.png
            .cache/editor-groups-vsix-200/*.json
            .cache/editor-groups-large-150/*.png
            .cache/editor-groups-large-150/*.json
            .cache/editor-groups-large-200/*.png
            .cache/editor-groups-large-200/*.json
            .cache/search-native/*.png
            .cache/search-native/*.json
            .cache/search-native-150/*.png
            .cache/search-native-150/*.json
            .cache/search-native-200/*.png
            .cache/search-native-200/*.json
            .cache/replace-native/*.png
            .cache/replace-native/*.json
            .cache/replace-native-150/*.png
            .cache/replace-native-150/*.json
            .cache/replace-native-200/*.png
            .cache/replace-native-200/*.json
            .cache/terminal-native/*.png
            .cache/terminal-native/*.json
            .cache/terminal-native-150/*.png
            .cache/terminal-native-150/*.json
            .cache/terminal-native-200/*.png
            .cache/terminal-native-200/*.json
            .cache/terminal-vsix/*.png
            .cache/terminal-vsix/*.json
            .cache/terminal-vsix-150/*.png
            .cache/terminal-vsix-150/*.json
            .cache/terminal-vsix-200/*.png
            .cache/terminal-vsix-200/*.json
            dist/*.zip
            dist/*.tar.gz
          include-hidden-files: true
          if-no-files-found: error
  portable:
    name: Portable model / Ubuntu
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: go test -race -shuffle=on -count=3 ./...
      - run: go vet ./...
      - name: No-cgo model tests
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Verify generated channel hashes and input policy
        run: python3 -m unittest discover -s scripts -p '*_test.py'
